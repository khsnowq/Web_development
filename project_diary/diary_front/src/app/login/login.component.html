<div class="login-container">
  <h2>Вход Personal diary</h2>

  <div class="form-group">
    <label>Логин:</label>
    <input [(ngModel)]="username" placeholder="Введите логин" />
  </div>

  <div class="form-group">
    <label>Пароль:</label>
    <input [(ngModel)]="password" type="password" placeholder="Введите пароль" />
  </div>

  <button (click)="login()">Войти</button>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
