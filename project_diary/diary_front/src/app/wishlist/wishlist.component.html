<div class="wishlist-container">
  <h2>Wishlist</h2>

  <div class="wishlist-form">
    <input [(ngModel)]="newItem.name" placeholder="Название желания">
    <select [(ngModel)]="newItem.category">
      <option value="material">Материальное</option>
      <option value="travel">Путешествия</option>
      <option value="learning">Обучение</option>
    </select>
    <input [(ngModel)]="newItem.link" placeholder="Ссылка (необязательно)">
    <select [(ngModel)]="newItem.status">
      <option value="pending">Ожидание</option>
      <option value="in_progress">В процессе</option>
      <option value="done">Выполнено</option>
    </select>
    <input type="file" (change)="onFileSelected($event)" accept="image/*">
    <button (click)="addItem()">Добавить</button>
  </div>

  <ul class="wishlist-list">
    <li *ngFor="let item of wishlist">
      <div class="wishlist-item">
        <p>
          <strong>{{ item.name }}</strong> 
          <span>{{ item.category }}</span>
        </p>
        <p>
          Статус: {{ getStatusText(item.status) }}
        </p>
        <a *ngIf="item.link" [href]="item.link" target="_blank">Перейти к ссылке</a>
        <div *ngIf="item.image" class="mt-2 relative">
          <img [src]="getImageUrl(item.image)" alt="Изображение желания" 
               class="max-w-full h-auto max-h-40 rounded border"
               (error)="handleImageError($event)">
          <div *ngIf="imageLoadError" class="absolute inset-0 bg-gray-100 flex items-center justify-center">
            <span class="text-gray-500">Изображение не загружено</span>
          </div>
        </div>
        <button (click)="deleteItem(item.id!)">Удалить</button>
      </div>
    </li>
  </ul>
</div>
